<h2>ساختار دیکشنری شده‌ی سوالات:</h2>
{% for q in structured_questions %}
  <div style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc;">
    <p><strong>{{ q.question }}</strong></p>
    <ul>
      <li>{{ q.A }}</li>
      <li>{{ q.B }}</li>
      <li>{{ q.C }}</li>
      <li>{{ q.D }}</li>
    </ul>
  </div>
{% endfor %}
